name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest upload
        run: |
          Z=$(git -c core.quotePath=false log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -m1 .)
          echo "Using: $Z"
          unzip -oq "$Z" -d tmp
          if [ -d tmp/vocab-app ]; then SRC=tmp/vocab-app; else SRC=tmp; fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          if [ -d "$SRC/android" ]; then echo "HAS_APK=1" >> "$GITHUB_ENV"; fi
          mkdir -p _site
          cp -r "$SRC/." _site/
          rm -rf _site/android
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/setup-java@v4
        if: env.HAS_APK == '1'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_APK == '1'
        with:
          gradle-version: '8.9'
      - name: Build APK
        if: env.HAS_APK == '1'
        run: |
          mkdir -p "$SRC/android/app/src/main/assets/www"
          cp -r _site/. "$SRC/android/app/src/main/assets/www/"
          cd "$SRC/android"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/VocabMaster.apk"
      - uses: actions/upload-artifact@v4
        if: env.HAS_APK == '1'
        with:
          name: VocabMaster-APK
          path: VocabMaster.apk
      - uses: softprops/action-gh-release@v2
        if: env.HAS_APK == '1'
        with:
          tag_name: build-${{ github.run_number }}
          name: VocabMaster build ${{ github.run_number }}
          files: VocabMaster.apk
          make_latest: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
